<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Diff Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            background-color: #f3f4f6;
            color: #1f2937;
            line-height: 1.5;
        }
        main {
            width: 90%;
            max-width: 1400px;
            margin-top: 20px;
        }
        h1 { text-align: center; font-size: 2em; margin-bottom: 20px; }
        .input-section {
            padding: 20px;
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .input-section input[type="text"], .input-section input[type="file"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex-grow: 1;
        }
        .input-section button {
            padding: 8px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .input-section button:hover { background-color: #4338ca; }
        #status { text-align: center; padding: 10px; font-weight: bold; font-size: 1.1em; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }

        .json-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .json-view {
            background-color: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
        }
        .json-view h2 { margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
        .json-view pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", Courier, monospace;
            background-color: #f9fafb;
            padding: 10px;
            border-radius: 4px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .diff-table-container {
             background-color: #fff;
             border: 1px solid #d1d5db;
             border-radius: 8px;
             padding: 15px;
        }
        .diff-table-container h2 { margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background-color: #f9fafb; font-weight: bold; }
        td pre { margin: 0; white-space: pre-wrap; font-family: "Courier New", Courier, monospace; }
        .op-add { background-color: #dcfce7; color: #14532d; }
        .op-remove { background-color: #fee2e2; color: #7f1d1d; }
        .op-replace { background-color: #fef3c7; color: #78350f; }
    </style>
</head>
<body>

    <main>
        <h1>JSON Diff Vergelijkingstool</h1>
        
        <div class="input-section">
            <label for="documentId">Document ID:</label>
            <input type="text" id="documentId" placeholder="Voer ID in...">
            <label for="newJsonFile">Nieuw bestand:</label>
            <input type="file" id="newJsonFile" accept=".json">
            <button id="compareBtn">Vergelijk</button>
        </div>
        
        <div id="status"></div>
        
        <div class="json-container">
            <div class="json-view">
                <h2>Oude Versie (uit Database)</h2>
                <pre id="old-json-output">Wacht op invoer...</pre>
            </div>
            <div class="json-view">
                <h2>Nieuwe Versie (uit Bestand)</h2>
                <pre id="new-json-output">Wacht op invoer...</pre>
            </div>
        </div>

        <div class="diff-table-container">
            <h2>Gevonden Verschillen</h2>
            <div id="diff-table-output">Geen vergelijking uitgevoerd.</div>
        </div>
    </main>

    <script>
        const documentIdInput = document.getElementById('documentId');
        const newJsonFileInput = document.getElementById('newJsonFile');
        const compareBtn = document.getElementById('compareBtn');
        const statusDiv = document.getElementById('status');
        const oldJsonOutput = document.getElementById('old-json-output');
        const newJsonOutput = document.getElementById('new-json-output');
        const diffTableOutput = document.getElementById('diff-table-output');

        compareBtn.addEventListener('click', async () => {
            const documentId = documentIdInput.value.trim();
            const newFile = newJsonFileInput.files[0];

            // Validatie
            if (!documentId || !newFile) {
                showStatus('Fout: Zowel een Document ID als een bestand zijn vereist.', 'error');
                return;
            }

            // Reset UI
            showStatus('Bezig met vergelijken...', null);
            oldJsonOutput.textContent = 'Laden...';
            newJsonOutput.textContent = 'Laden...';
            diffTableOutput.innerHTML = 'Laden...';

            try {
                // Maak FormData voor de POST request
                const formData = new FormData();
                formData.append('file', newFile);

                // Start alle API-aanroepen en het lezen van het bestand tegelijk
                const [diffResponse, oldJsonResponse, newJsonString] = await Promise.all([
                    fetch(`http://192.168.178.170:8443/diff/${documentId}`, { method: 'POST', body: formData }),
                    fetch(`http://192.168.178.170:8443/search-by-id?id=${documentId}`),
                    newFile.text()
                ]);

                // Verwerk de response van de diff-call
                if (!diffResponse.ok) throw new Error(`Backend diff-error (status: ${diffResponse.status})`);
                const differences = await diffResponse.json();

                // Verwerk de response van de call om de oude JSON op te halen
                if (!oldJsonResponse.ok) throw new Error(`Kon document met ID ${documentId} niet vinden (status: ${oldJsonResponse.status}).`);
                const oldJsonData = await oldJsonResponse.json();
                const oldDocument = oldJsonData.learnings && oldJsonData.learnings[0] ? oldJsonData.learnings[0].document : {};
                
                // Toon de volledige JSON-objecten
                oldJsonOutput.textContent = JSON.stringify(oldDocument, null, 2);
                newJsonOutput.textContent = JSON.stringify(JSON.parse(newJsonString), null, 2);
                
                // Toon de tabel met verschillen
                renderDiffTable(differences);
                showStatus('Vergelijking voltooid!', 'success');

            } catch (error) {
                console.error('Er is een fout opgetreden:', error);
                showStatus(`Fout: ${error.message}`, 'error');
                oldJsonOutput.textContent = 'Fout bij laden.';
                newJsonOutput.textContent = 'Fout bij laden.';
                diffTableOutput.innerHTML = 'Fout bij laden.';
            }
        });
        
        function renderDiffTable(differences) {
            if (!differences || differences.length === 0) {
                diffTableOutput.innerHTML = '<p>Geen verschillen gevonden!</p>';
                return;
            }

            const tableRows = differences.map(diff => {
                const opClass = `op-${diff.operation}`;
                const from = diff.from !== null ? JSON.stringify(diff.from, null, 2) : '<em>null</em>';
                const to = diff.to !== null ? JSON.stringify(diff.to, null, 2) : '<em>null</em>';
                
                return `
                    <tr>
                        <td class="${opClass}"><strong>${diff.operation.toUpperCase()}</strong></td>
                        <td><code>${diff.path}</code></td>
                        <td><pre>${from}</pre></td>
                        <td><pre>${to}</pre></td>
                    </tr>
                `;
            }).join('');

            diffTableOutput.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Operatie</th>
                            <th>Pad</th>
                            <th>Oude Waarde (From)</th>
                            <th>Nieuwe Waarde (To)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type || '';
        }
    </script>
</body>
</html>
